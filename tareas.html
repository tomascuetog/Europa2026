<style>
/* ── PERSON TABS ──────────────────────── */
.person-tabs{display:flex;gap:.5rem;margin:1.25rem 0 .75rem;}
.person-tab{font-family:Outfit,sans-serif;font-size:.82rem;font-weight:600;padding:.5rem 1.4rem;border-radius:20px;border:2px solid rgba(13,27,42,.12);background:transparent;color:var(--text-mid);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;}
.person-tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.person-progress{font-family:Outfit,sans-serif;font-size:.75rem;color:var(--text-mid);margin-bottom:1.25rem;}

/* ── CUSTOM ADD ROW ───────────────────── */
.pack-add-row{display:flex;gap:.5rem;align-items:center;margin-top:1.5rem;}
.pack-add-inp{flex:1;border:1px solid rgba(13,27,42,.15);border-radius:8px;padding:.4rem .75rem;font-family:Outfit,sans-serif;font-size:.78rem;color:var(--navy);background:#fff;}
.pack-add-inp:focus{outline:none;border-color:var(--gold);}
.pack-add-btn{font-family:Outfit,sans-serif;font-size:.72rem;font-weight:600;color:var(--gold);background:none;border:1.5px dashed rgba(201,151,58,.5);border-radius:20px;padding:.35rem .9rem;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:all .15s;}
.pack-add-btn:hover{background:rgba(201,151,58,.07);border-color:var(--gold);}
.custom-section{margin-top:1.25rem;}
.custom-section-title{font-family:Outfit,sans-serif;font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-bottom:.6rem;padding-bottom:.4rem;border-bottom:1px solid rgba(201,151,58,.2);}
.pack-del{background:none;border:none;font-size:.75rem;color:rgba(13,27,42,.2);cursor:pointer;padding:0 .25rem;line-height:1;flex-shrink:0;margin-left:auto;-webkit-tap-highlight-color:transparent;}
.pack-del:hover{color:#ef4444;}
.pack-reset-row{margin-top:2rem;}

/* ── SECTION HEADER ROW ───────────────── */
.section-header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem;}
.edit-toggle-btn{font-family:Outfit,sans-serif;font-size:.72rem;font-weight:600;color:var(--text-mid);background:rgba(13,27,42,.06);border:1px solid rgba(13,27,42,.12);border-radius:20px;padding:.35rem .85rem;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;white-space:nowrap;flex-shrink:0;}
.edit-toggle-btn:hover{border-color:var(--gold);color:var(--gold);}
.edit-toggle-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}

/* ── TASK EDIT BUTTONS ────────────────── */
.task-edit-btns{display:none;align-items:center;gap:.3rem;flex-shrink:0;margin-left:auto;}
.task-edit-mode .task-edit-btns{display:flex;}
.ti-btn{font-family:Outfit,sans-serif;font-size:.7rem;background:none;border:1px solid rgba(13,27,42,.15);border-radius:6px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-mid);-webkit-tap-highlight-color:transparent;transition:all .15s;padding:0;flex-shrink:0;}
.ti-btn:hover{border-color:var(--gold);color:var(--gold);}
.ti-btn.del:hover{border-color:#ef4444;color:#ef4444;}

/* ── GROUP ADD BUTTON ─────────────────── */
.task-group-add-btn{display:none;font-family:Outfit,sans-serif;font-size:.63rem;font-weight:600;color:var(--gold);background:none;border:1px dashed rgba(201,151,58,.5);border-radius:20px;padding:.18rem .55rem;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;white-space:nowrap;}
.task-group-add-btn:hover{background:rgba(201,151,58,.07);}
.task-edit-mode .task-group-add-btn{display:inline-flex;}

/* ── NEW GROUP BUTTON ─────────────────── */
.new-group-btn{display:none;font-family:Outfit,sans-serif;font-size:.75rem;font-weight:600;color:var(--gold);background:none;border:1.5px dashed rgba(201,151,58,.5);border-radius:12px;padding:.6rem 1.2rem;cursor:pointer;width:100%;margin-top:1.25rem;-webkit-tap-highlight-color:transparent;transition:all .15s;}
.new-group-btn:hover{background:rgba(201,151,58,.07);}
.task-edit-mode .new-group-btn{display:block;}

/* ── PACK EDIT BUTTONS ────────────────── */
.pack-edit-btns{display:none;align-items:center;gap:.3rem;flex-shrink:0;margin-left:.25rem;}
.pack-edit-mode .pack-edit-btns{display:flex;}
.pack-edit-mode .pack-del{display:none;}/* hide individual del btn in edit mode — use edit-btns instead */
.pi-btn{font-family:Outfit,sans-serif;font-size:.7rem;background:none;border:1px solid rgba(13,27,42,.15);border-radius:6px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-mid);-webkit-tap-highlight-color:transparent;transition:all .15s;padding:0;flex-shrink:0;}
.pi-btn:hover{border-color:var(--gold);color:var(--gold);}
.pi-btn.del:hover{border-color:#ef4444;color:#ef4444;}

/* ── PACK CAT ADD BUTTON ──────────────── */
.pack-cat-add-btn{display:none;font-family:Outfit,sans-serif;font-size:.63rem;font-weight:600;color:var(--gold);background:none;border:1px dashed rgba(201,151,58,.5);border-radius:20px;padding:.2rem .6rem;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:all .15s;margin-top:.5rem;}
.pack-cat-add-btn:hover{background:rgba(201,151,58,.07);}
.pack-edit-mode .pack-cat-add-btn{display:block;}

/* ── PACK ITEM LAYOUT ─────────────────── */
.pack-item{display:flex;align-items:center;gap:.6rem;padding:.3rem 0;border-bottom:1px solid var(--cream-dark);cursor:pointer;}
.pack-item:last-child{border-bottom:none;}
.pack-item .pcb{width:16px;height:16px;border-radius:3px;border:2px solid #d1d5db;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;background:white;}
.pack-item .pcb.done{background:var(--gold);border-color:var(--gold);}
.pack-item .pcb.done::after{content:'✓';color:white;font-size:9px;font-weight:700;}
.pack-item span{font-size:.77rem;color:var(--text);transition:all .2s;flex:1;}
.pack-item span.done{text-decoration:line-through;color:var(--text-mid);}
.pack-item span .must{font-size:.6rem;background:#fef3c7;color:#92400e;padding:.1rem .3rem;border-radius:4px;margin-left:.3rem;}
.pack-item.hidden-item{opacity:.4;}

/* ── TOAST ─────────────────────────────── */
.save-toast{position:fixed;bottom:calc(5rem + env(safe-area-inset-bottom,0));left:50%;transform:translateX(-50%);font-family:Outfit,sans-serif;font-size:.75rem;font-weight:600;padding:.45rem 1.2rem;border-radius:20px;opacity:0;transition:opacity .25s;z-index:9999;pointer-events:none;white-space:nowrap;}
.save-toast.ok{background:rgba(74,222,128,.92);color:#14532d;}
.save-toast.err{background:rgba(239,68,68,.92);color:#fff;}

/* ── BOTTOM SHEET ──────────────────────── */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:1000;pointer-events:none;transition:background .25s;}
.sheet-overlay.open{background:rgba(0,0,0,.45);pointer-events:all;}
.bottom-sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;padding:1.5rem 1.5rem calc(1.5rem + env(safe-area-inset-bottom,0));z-index:1001;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:90vh;overflow-y:auto;}
.bottom-sheet.open{transform:translateY(0);}
.sheet-handle{width:40px;height:4px;background:rgba(13,27,42,.12);border-radius:2px;margin:0 auto 1.25rem;}
.sheet-title{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:400;color:var(--navy);margin-bottom:1.25rem;}
.sheet-field{margin-bottom:1rem;}
.sheet-label{font-family:Outfit,sans-serif;font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-mid);display:block;margin-bottom:.4rem;}
.sheet-input,.sheet-select{width:100%;border:1.5px solid rgba(13,27,42,.15);border-radius:10px;padding:.55rem .8rem;font-family:Outfit,sans-serif;font-size:.85rem;color:var(--navy);background:#fff;appearance:none;-webkit-appearance:none;}
.sheet-input:focus,.sheet-select:focus{outline:none;border-color:var(--gold);}
.sheet-new-group-inp{display:none;margin-top:.5rem;}
.sheet-check-row{display:flex;align-items:center;gap:.65rem;margin-top:.25rem;}
.sheet-check-row input{width:16px;height:16px;accent-color:var(--gold);}
.sheet-check-row label{font-family:Outfit,sans-serif;font-size:.82rem;color:var(--text);}
.sheet-btns{display:flex;gap:.75rem;margin-top:1.5rem;}
.sheet-save-btn{flex:1;background:var(--navy);color:#fff;font-family:Outfit,sans-serif;font-size:.82rem;font-weight:600;border:none;border-radius:12px;padding:.8rem;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s;}
.sheet-save-btn:hover{background:#1a2f47;}
.sheet-cancel-btn{background:rgba(13,27,42,.07);color:var(--text-mid);font-family:Outfit,sans-serif;font-size:.82rem;font-weight:600;border:none;border-radius:12px;padding:.8rem 1.25rem;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s;}
.sheet-cancel-btn:hover{background:rgba(13,27,42,.12);}
</style>
</head>

      var save = {persons: packPersonState, shared: sharedPack};
      localStorage.setItem(LS_PACK, JSON.stringify(save));
    } catch(e) {}
  }
  function loadPackLocal() {
    try {
      var r = localStorage.getItem(LS_PACK);
      if (r) {
        var parsed = JSON.parse(r);
        // Support old format (just person state object)
        if (parsed.persons) {
          PERSONS.forEach(function(p) { packPersonState[p.id] = parsed.persons[p.id] || {}; });
          sharedPack = parsed.shared || {};
        } else {
          PERSONS.forEach(function(p) { packPersonState[p.id] = parsed[p.id] || {}; });
        }
        return;
      }
    } catch(e) {}
    PERSONS.forEach(function(p) { packPersonState[p.id] = {}; });
    sharedPack = {};
  }

  function defaultTasksToFlat() {
    var flat = [];
    DEFAULT_TASKS.forEach(function(g) {
      g.items.forEach(function(it) {
        flat.push({
          id:          it.id,
          group_name:  g.group,
          group_order: g.order,
          label:       it.label,
          item_order:  it.order,
          deleted:     false
        });
      });
    });
    return flat;
  }

  // ── TOAST ─────────────────────────────────────────────────
  function showToast(msg, isErr) {
    var t = document.getElementById('saveToast');
    if (!t) return;
    t.textContent = msg;
    t.className = 'save-toast ' + (isErr ? 'err' : 'ok');
    t.style.opacity = '1';
    clearTimeout(t._tid);
    t._tid = setTimeout(function() { t.style.opacity = '0'; }, isErr ? 3500 : 1800);
  }

  // ── TASK CATALOG UTILS ────────────────────────────────────
  function getTaskGroups() {
    var map = {};
    taskCatalog.filter(function(it) { return !it.deleted; }).forEach(function(it) {
      if (!map[it.group_name]) {
        map[it.group_name] = {group_name:it.group_name, group_order:it.group_order, items:[]};
      }
      map[it.group_name].items.push(it);
    });
    var groups = Object.values(map);
    groups.sort(function(a,b) { return a.group_order - b.group_order; });
    groups.forEach(function(g) { g.items.sort(function(a,b) { return a.item_order - b.item_order; }); });
    return groups;
  }

  // ── RENDER TASKS ──────────────────────────────────────────
  function renderTasks() {
    var grid = document.getElementById('tasksGrid');
    if (!grid) return;
    grid.innerHTML = '';
    var groups = getTaskGroups();
    var total = 0, done = 0;
    var container = document.getElementById('tareas').querySelector('div');

    groups.forEach(function(group) {
      var dG = group.items.filter(function(it) { return tasksState[it.id]; }).length;
      total += group.items.length; done += dG;

      var div = document.createElement('div');
      div.className = 'task-group';
      if (taskEditMode) div.classList.add('task-edit-mode');

      var titleRow = document.createElement('div');
      titleRow.className = 'task-group-title';

      var titleText = document.createElement('span');
      titleText.textContent = group.group_name;
      titleRow.appendChild(titleText);

      var prog = document.createElement('span');
      prog.className = 'task-progress';
      prog.textContent = dG + '/' + group.items.length;
      titleRow.appendChild(prog);

      if (taskCatalogEditable) {
        var addBtn = document.createElement('button');
        addBtn.className = 'task-group-add-btn';
        addBtn.textContent = '+ Tarea';
        (function(gname, gorder) {
          addBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            openTaskSheet(null, gname, gorder);
          });
        })(group.group_name, group.group_order);
        titleRow.appendChild(addBtn);
      }

      div.appendChild(titleRow);

      group.items.forEach(function(it) {
        var d = !!tasksState[it.id];
        var el = document.createElement('div');
        el.className = 'task-item';

        var cb = document.createElement('div');
        cb.className = 'task-cb' + (d ? ' done' : '');

        var lbl = document.createElement('span');
        lbl.className = 'task-label' + (d ? ' done' : '');
        lbl.textContent = it.label;

        el.appendChild(cb);
        el.appendChild(lbl);

        if (taskCatalogEditable) {
          var editBtns = document.createElement('div');
          editBtns.className = 'task-edit-btns';

          var editBtn = document.createElement('button');
          editBtn.className = 'ti-btn';
          editBtn.textContent = '✏️';
          editBtn.title = 'Editar';
          (function(item) {
            editBtn.addEventListener('click', function(e) {
              e.stopPropagation();
              openTaskSheet(item, item.group_name, item.group_order);
            });
          })(it);
          editBtns.appendChild(editBtn);

          var delBtn = document.createElement('button');
          delBtn.className = 'ti-btn del';
          delBtn.textContent = '×';
          delBtn.title = 'Eliminar';
          (function(item) {
            delBtn.addEventListener('click', function(e) {
              e.stopPropagation();
              if (!confirm('¿Eliminar "' + item.label + '"?')) return;
              deleteTaskItem(item.id);
            });
          })(it);
          editBtns.appendChild(delBtn);

          el.appendChild(editBtns);
        }

        el.addEventListener('click', function(e) {
          if (e.target.closest('.task-edit-btns')) return;
          tasksState[it.id] = !tasksState[it.id];
          saveTasksLocal();
          renderTasks();
          sb.from('tasks').upsert({id:it.id, done:!!tasksState[it.id], updated_at:new Date().toISOString()})
            .then(function(res){ if(res.error) showToast('⚠️ Sin sincronizar ('+res.error.code+')',true); else showToast('✓ Guardado',false); });
        });

        div.appendChild(el);
      });

      grid.appendChild(div);
    });

    // Apply edit mode class to grid wrapper
    if (taskEditMode) {
      var btn = document.getElementById('newTaskGroupBtn');
      if (btn) btn.classList.add('task-edit-mode');
    }

    var sum = document.getElementById('tasksSummary');
    if (sum) sum.innerHTML = '<strong>' + done + ' de ' + total + '</strong> tareas completadas';
  }

  // ── TASKS RESET ───────────────────────────────────────────
  document.getElementById('tasksReset').addEventListener('click', function() {
    if (!confirm('¿Desmarcar todas las tareas?')) return;
    var rows = [];
    getTaskGroups().forEach(function(g) {
      g.items.forEach(function(it) {
        rows.push({id:it.id, done:false, updated_at:new Date().toISOString()});
      });
    });
    tasksState = {}; saveTasksLocal(); renderTasks();
    if (rows.length) sb.from('tasks').upsert(rows).then(function(res){ if(res.error) showToast('⚠️ Sin sincronizar ('+res.error.code+')',true); });
  });

  // ── TASK CATALOG CRUD ──────────────────────────────────────
  function saveTaskItem(item) {
    var idx = taskCatalog.findIndex(function(it){ return it.id === item.id; });
    if (idx >= 0) taskCatalog[idx] = item; else taskCatalog.push(item);
    saveCatalogLocal();
    renderTasks();

    sb.from('task_items').upsert({
      id:          item.id,
      group_name:  item.group_name,
      group_order: item.group_order,
      label:       item.label,
      item_order:  item.item_order,
      deleted:     false,
      updated_at:  new Date().toISOString()
    }).then(function(res) {
      if (res.error) showToast('⚠️ Sin sincronizar ('+res.error.code+')', true);
      else showToast('✓ Guardado', false);
    }).catch(function() { showToast('⚠️ Sin conexión — guardado local', true); });
  }

  function deleteTaskItem(id) {
    var idx = taskCatalog.findIndex(function(it){ return it.id === id; });
    if (idx >= 0) taskCatalog[idx].deleted = true;
    saveCatalogLocal();
    renderTasks();

    sb.from('task_items').upsert({
      id: id, deleted: true, updated_at: new Date().toISOString()
    }).then(function(res) {
      if (res.error) showToast('⚠️ Sin sincronizar ('+res.error.code+')', true);
      else showToast('✓ Eliminado', false);
    }).catch(function() { showToast('⚠️ Sin conexión — guardado local', true); });
  }

  document.getElementById('taskEditToggle').addEventListener('click', function() {

  // ── PERSON TABS ───────────────────────────────────────────
  function initPersonTabs() {
    document.querySelectorAll('.person-tab').forEach(function(tab) {
      tab.classList.toggle('active', tab.dataset.person === activePerson);
      tab.addEventListener('click', function() {
        activePerson = this.dataset.person;
        localStorage.setItem('activePerson', activePerson);
        document.querySelectorAll('.person-tab').forEach(function(t) {
          t.classList.toggle('active', t.dataset.person === activePerson);
        });
        renderPack();

  // ── RENDER PACK ───────────────────────────────────────────
  function renderPack() {
    var grid = document.getElementById('packGrid');
    if (!grid) return;
    grid.innerHTML = '';
    var personState = packPersonState[activePerson] || {};
    var total = 0, done = 0;

    DEFAULT_PACKS.forEach(function(cat) {
      var div = document.createElement('div');
      div.className = 'packing-cat';
      if (packEditMode) div.classList.add('pack-edit-mode');

      var titleRow = document.createElement('div');
      titleRow.className = 'packing-cat-title';
      titleRow.textContent = cat.cat;
      div.appendChild(titleRow);

      cat.items.forEach(function(item) {
        // Check if hidden by shared
        var sharedOverride = sharedPack[item.id];
        if (sharedOverride && sharedOverride.deleted) {
          // In edit mode, still show dimmed so user can restore
          if (!packEditMode) return;
          var hiddenEl = makePackDefaultItem(item, personState, cat, true);
          div.appendChild(hiddenEl);
          return;
        }
        // Get effective label
        var effectiveLabel = (sharedOverride && sharedOverride.custom_label) ? sharedOverride.custom_label : item.t;
        var effectiveItem = {id: item.id, t: effectiveLabel, must: item.must};
        var el = makePackDefaultItem(effectiveItem, personState, cat, false);
        total++;
        var itemState = personState[item.id] || {};
        if (itemState.done) done++;
        div.appendChild(el);
      });

      // Shared custom items for this category
      Object.keys(sharedPack).forEach(function(sid) {
        var sp = sharedPack[sid];
        if (sp.deleted || !sp.custom_label || sp.cat !== cat.cat) return;
        // Skip if it's a default item override (already shown above)
        var isDefault = cat.items.some(function(di) { return di.id === sid; });
        if (isDefault) return;
        total++;
        var itemState = personState[sid] || {};
        if (itemState.done) done++;
        div.appendChild(makePackSharedCustomItem(sid, sp, personState, cat));
      });

      // Add button for this category (edit mode)
      if (packEditMode) {
        var addCatBtn = document.createElement('button');
        addCatBtn.className = 'pack-cat-add-btn';
        addCatBtn.textContent = '+ Agregar para todos';
        (function(catName) {
          addCatBtn.addEventListener('click', function() {
            openPackSheet(null, catName);
          });
        })(cat.cat);
        div.appendChild(addCatBtn);
      }

      grid.appendChild(div);
    });

    // Personal custom items (not shared)
    var customItems = Object.keys(personState).filter(function(id) {
      return personState[id] && personState[id].custom_label;
    });
    var customSection = document.getElementById('customSection');
    var customList = document.getElementById('customList');
    if (customSection && customList) {
      customList.innerHTML = '';
      if (customItems.length) {
        customSection.style.display = '';
        customItems.forEach(function(id) {
          var st = personState[id];
          total++;
          if (st.done) done++;
          customList.appendChild(makePersonalCustomItem(id, st, personState));
        });
      } else {
        customSection.style.display = 'none';
      }
    }

    var pLabel = PERSONS.filter(function(p){ return p.id===activePerson; })[0].label;
    var prog = document.getElementById('packProgress');
    if (prog) prog.textContent = done + ' de ' + total + ' ítems marcados — ' + pLabel;
  }

  function makePackDefaultItem(item, personState, cat, isHidden) {
    var itemState = personState[item.id] || {};
    var isDone = !!itemState.done;
    var sharedOverride = sharedPack[item.id];
    var isCustomLabel = sharedOverride && sharedOverride.custom_label;

    var el = document.createElement('div');
    el.className = 'pack-item' + (isHidden ? ' hidden-item' : '');

    var cb = document.createElement('div');
    cb.className = 'pcb' + (isDone ? ' done' : '');

    var lbl = document.createElement('span');
    if (isDone) lbl.className = 'done';
    lbl.textContent = item.t;
    if (item.must && !isHidden) {
      var m = document.createElement('span'); m.className = 'must'; m.textContent = 'imprescindible'; lbl.appendChild(m);
    }

    el.appendChild(cb); el.appendChild(lbl);

    // Edit buttons (pack edit mode)
    if (packEditMode) {
      var editBtns = document.createElement('div');
      editBtns.className = 'pack-edit-btns';

      if (isHidden) {
        // Restore button
        var restBtn = document.createElement('button');
        restBtn.className = 'pi-btn';
        restBtn.title = 'Restaurar';
        restBtn.textContent = '↩';
        (function(itemId, catName) {
          restBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            delete sharedPack[itemId];
            savePackLocal();
            // Delete from supabase _shared
            sb.from('packing_person').delete().eq('id', itemId).eq('person', '_shared');
            renderPack();
          });
        })(item.id, cat.cat);
        editBtns.appendChild(restBtn);
      } else {
        var editBtn = document.createElement('button');
        editBtn.className = 'pi-btn';
        editBtn.title = 'Editar para todos';
        editBtn.textContent = '✏️';
        (function(it, catName) {
          editBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            openPackSheet(it, catName, true);
          });
        })(item, cat.cat);
        editBtns.appendChild(editBtn);

        var hideBtn = document.createElement('button');
        hideBtn.className = 'pi-btn del';
        hideBtn.title = 'Ocultar para todos';
        hideBtn.textContent = '×';
        (function(itemId) {
          hideBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (!confirm('¿Ocultar este ítem para todos?')) return;
            hideSharedDefault(itemId);
          });
        })(item.id);
        editBtns.appendChild(hideBtn);
      }

      el.appendChild(editBtns);
      el.style.pointerEvents = isHidden ? 'none' : '';
    }

    if (!isHidden) {
      el.addEventListener('click', function(e) {
        if (e.target.closest('.pack-edit-btns')) return;
        var newDone = !isDone;
        if (!packPersonState[activePerson]) packPersonState[activePerson] = {};
        if (!packPersonState[activePerson][item.id]) packPersonState[activePerson][item.id] = {};
        packPersonState[activePerson][item.id].done = newDone;
        savePackLocal();
        sb.from('packing_person').upsert({id:item.id, person:activePerson, done:newDone, updated_at:new Date().toISOString()})
          .then(function(res){ if(res.error) showToast('⚠️ Sin sincronizar ('+res.error.code+')',true); else showToast('✓ Guardado',false); });
        renderPack();
      });
    }

    return el;
  }

        .then(function(res){ if(res.error) showToast('⚠️ Sin sincronizar ('+res.error.code+')',true); else showToast('✓ Guardado',false); });

  function makePersonalCustomItem(id, st, personState) {
    var isDone = !!st.done;
    var el = document.createElement('div');
    el.className = 'pack-item';
    var cb = document.createElement('div'); cb.className = 'pcb' + (isDone ? ' done' : '');
    var lbl = document.createElement('span'); if (isDone) lbl.className = 'done'; lbl.textContent = st.custom_label;
    el.appendChild(cb); el.appendChild(lbl);

    var delBtn = document.createElement('button');
    delBtn.className = 'pack-del'; delBtn.title = 'Eliminar'; delBtn.textContent = '×';

    delBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (!confirm('¿Eliminar "' + st.custom_label + '"?')) return;
      delete packPersonState[activePerson][id];
      savePackLocal();
      sb.from('packing_person').delete().eq('id', id).eq('person', activePerson);
      renderPack();
    });

    el.addEventListener('click', function(e) {
      if (e.target.classList.contains('pack-del')) return;
      var newDone = !isDone;
      if (!packPersonState[activePerson]) packPersonState[activePerson] = {};
      if (!packPersonState[activePerson][id]) packPersonState[activePerson][id] = {};
      packPersonState[activePerson][id].done = newDone;
      savePackLocal();
      var upsertRow = {id:id, person:activePerson, done:newDone, custom_label:st.custom_label, updated_at:new Date().toISOString()};

      personState[id].done = false;
      var row = {id:id, person:activePerson, done:false, updated_at:new Date().toISOString()};
      if (personState[id].custom_label) row.custom_label = personState[id].custom_label;
      rows.push(row);
    });
    // Also reset all default item entries for this person
    DEFAULT_PACKS.forEach(function(cat) {
      cat.items.forEach(function(it) {
        if (!personState[it.id]) return;
        personState[it.id].done = false;
        rows.push({id:it.id, person:activePerson, done:false, updated_at:new Date().toISOString()});
      });
    });
    savePackLocal();
    if (rows.length) sb.from('packing_person').upsert(rows)
      .then(function(res){ if(res.error) showToast('⚠️ Sin sincronizar ('+res.error.code+')',true); });
    renderPack();
  });

  // ── BOTTOM SHEET ─────────────────────────────────────────
  var sheetMode = 'task'; // 'task' or 'pack'
  var sheetEditingTask = null;
  var sheetEditingPack = null; // {id, isDefault, catName}

  function openTaskSheet(item, defaultGroup, defaultGroupOrder, forceNewGroup) {
    sheetMode = 'task';
    sheetEditingTask = item;
    document.getElementById('sheetTaskFields').style.display = '';
    document.getElementById('sheetPackFields').style.display = 'none';
    document.getElementById('sheetTitle').textContent = item ? 'Editar tarea' : 'Nueva tarea';

    // Populate group select
    var groupSel = document.getElementById('sheetTaskGroup');
    groupSel.innerHTML = '';
    var groups = getTaskGroups();
    groups.forEach(function(g) {
      var opt = document.createElement('option');
      opt.value = g.group_name;
      opt.textContent = g.group_name;
      if (defaultGroup && g.group_name === defaultGroup) opt.selected = true;
      groupSel.appendChild(opt);
    });
    var newOpt = document.createElement('option');
    newOpt.value = '__new__';
    newOpt.textContent = 'Nuevo grupo…';
    groupSel.appendChild(newOpt);

    var newGrpInp = document.getElementById('sheetTaskNewGroup');
    if (forceNewGroup) {
      groupSel.value = '__new__';
      newGrpInp.style.display = 'block';
      newGrpInp.value = '';
    } else {
      newGrpInp.style.display = 'none';
      if (defaultGroup) groupSel.value = defaultGroup;
    }

    document.getElementById('sheetTaskLabel').value = item ? item.label : '';

    openSheet();
    setTimeout(function() { document.getElementById('sheetTaskLabel').focus(); }, 350);
  }

  function openPackSheet(item, catName, isDefault, customId) {
    sheetMode = 'pack';
    sheetEditingPack = item ? {id: customId || item.id, isDefault: isDefault, catName: catName} : null;
    document.getElementById('sheetTaskFields').style.display = 'none';
    document.getElementById('sheetPackFields').style.display = '';
    document.getElementById('sheetTitle').textContent = item ? 'Editar ítem' : 'Nuevo ítem compartido';

    // Populate cat select
    var catSel = document.getElementById('sheetPackCat');
    catSel.innerHTML = '';
    DEFAULT_PACKS.forEach(function(c) {
      var opt = document.createElement('option');
      opt.value = c.cat;
      opt.textContent = c.cat;
      if (catName && c.cat === catName) opt.selected = true;
      catSel.appendChild(opt);
    });

    document.getElementById('sheetPackLabel').value = item ? item.t : '';
    document.getElementById('sheetPackMust').checked = item ? !!item.must : false;

    openSheet();
    setTimeout(function() { document.getElementById('sheetPackLabel').focus(); }, 350);
  }

  function openSheet() {
    document.getElementById('sheetOverlay').classList.add('open');
    document.getElementById('bottomSheet').classList.add('open');
  }

  function closeSheet() {
    document.getElementById('sheetOverlay').classList.remove('open');
    document.getElementById('bottomSheet').classList.remove('open');
    sheetEditingTask = null;
    sheetEditingPack = null;
  }

  document.getElementById('sheetTaskGroup').addEventListener('change', function() {
    var newGrpInp = document.getElementById('sheetTaskNewGroup');
    newGrpInp.style.display = this.value === '__new__' ? 'block' : 'none';
    if (this.value === '__new__') newGrpInp.focus();
  });

  document.getElementById('sheetOverlay').addEventListener('click', closeSheet);
  document.getElementById('sheetCancel').addEventListener('click', closeSheet);

  document.getElementById('sheetSave').addEventListener('click', function() {
    if (sheetMode === 'task') {
      saveTaskFromSheet();
    } else {
      savePackFromSheet();
    }
  });

  function saveTaskFromSheet() {
    var groupSel   = document.getElementById('sheetTaskGroup');
    var groupName  = groupSel.value;
    var groupOrder = 0;
    var newGrpInp  = document.getElementById('sheetTaskNewGroup');
    var labelVal   = document.getElementById('sheetTaskLabel').value.trim();

    if (groupName === '__new__') {
      groupName = newGrpInp.value.trim();
      if (!groupName) { newGrpInp.focus(); return; }
      var groups = getTaskGroups();
      groupOrder = groups.length > 0 ? (groups[groups.length-1].group_order + 1) : 0;
    } else {
      var groups = getTaskGroups();
      var found = groups.find(function(g) { return g.group_name === groupName; });
      groupOrder = found ? found.group_order : 0;
    }

    if (!labelVal) { document.getElementById('sheetTaskLabel').focus(); return; }

    var item;
    if (sheetEditingTask) {
      item = {
        id:          sheetEditingTask.id,
        group_name:  groupName,
        group_order: groupOrder,
        label:       labelVal,
        item_order:  sheetEditingTask.item_order,
        deleted:     false
      };
    } else {
      var groups = getTaskGroups();
      var gFound = groups.find(function(g) { return g.group_name === groupName; });
      var nextOrder = gFound ? gFound.items.length : 0;
      item = {
        id:          'ti_' + Date.now(),
        group_name:  groupName,
        group_order: groupOrder,
        label:       labelVal,
        item_order:  nextOrder,
        deleted:     false
      };
    }

    saveTaskItem(item);
    closeSheet();
  }

  function savePackFromSheet() {
    var catVal   = document.getElementById('sheetPackCat').value;
    var labelVal = document.getElementById('sheetPackLabel').value.trim();
    var mustVal  = document.getElementById('sheetPackMust').checked;

    if (!labelVal) { document.getElementById('sheetPackLabel').focus(); return; }

    if (sheetEditingPack) {
      if (sheetEditingPack.isDefault) {
        // Edit label of a default item for all
        editSharedDefault(sheetEditingPack.id, labelVal, catVal);
      } else {
        // Edit shared custom item
        saveSharedPackItem(sheetEditingPack.id, labelVal, catVal, mustVal);
      }
    } else {
      // New shared item
      var newId = 'shared_' + Date.now();
      saveSharedPackItem(newId, labelVal, catVal, mustVal);
    }

    closeSheet();
  }

  // ── REAL-TIME ─────────────────────────────────────────────
  sb.channel('tareas_sync')
    .on('postgres_changes', {event:'*', schema:'public', table:'tasks'}, function(p) {
      if (p.new) { tasksState[p.new.id] = p.new.done; saveTasksLocal(); renderTasks(); }
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'task_items'}, function(p) {
      if (!p.new) return;
      var r = p.new;
      var idx = taskCatalog.findIndex(function(it) { return it.id === r.id; });
      var item = {
        id: r.id, group_name: r.group_name, group_order: r.group_order,
        label: r.label, item_order: r.item_order, deleted: r.deleted
      };
      if (idx >= 0) { taskCatalog[idx] = item; } else { taskCatalog.push(item); }
      saveCatalogLocal();
      renderTasks();
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'packing_person'}, function(p) {
      if (!p.new) return;
      var r = p.new;
      if (r.person === '_shared') {
        sharedPack[r.id] = {custom_label: r.custom_label, cat: r.cat, done: r.done, deleted: r.deleted};
        savePackLocal();
        renderPack();
        return;
      }
      if (!packPersonState[r.person]) packPersonState[r.person] = {};
      packPersonState[r.person][r.id] = {done: r.done, custom_label: r.custom_label};
      savePackLocal();
      if (r.person === activePerson) renderPack();
    })
    .on('postgres_changes', {event:'DELETE', schema:'public', table:'packing_person'}, function(p) {
      if (!p.old) return;
      var r = p.old;
      if (r.person === '_shared') {
        delete sharedPack[r.id];
        savePackLocal();
        renderPack();
        return;
      }
      if (packPersonState[r.person]) delete packPersonState[r.person][r.id];
      savePackLocal();
      if (r.person === activePerson) renderPack();
    })
    .subscribe();

  // ── SEED task_items ────────────────────────────────────────
  function seedTaskItems() {
    var rows = defaultTasksToFlat().map(function(it) {
      return {
        id:          it.id,
        group_name:  it.group_name,
        group_order: it.group_order,
        label:       it.label,
        item_order:  it.item_order,
        deleted:     false,
        updated_at:  new Date().toISOString()
      };
    });
    sb.from('task_items').upsert(rows).then(function(res) {
      if (res.error) console.error('Seed task_items error:', res.error);
    });
  }

  // ── INIT ──────────────────────────────────────────────────
  // 1) Load local data immediately
  loadTasksLocal();
  loadCatalogLocal();
  loadPackLocal();
  PERSONS.forEach(function(p) { if (!packPersonState[p.id]) packPersonState[p.id] = {}; });

  initPersonTabs();
  renderTasks();
  renderPack();

  // 2) Sync from Supabase in background
  sb.from('tasks').select('*').then(function(r) {
    if (r.error) { console.error('tasks:', r.error); return; }
    (r.data || []).forEach(function(row) { tasksState[row.id] = row.done; });
    saveTasksLocal();
    renderTasks();
  });

  sb.from('task_items').select('*').then(function(r) {
    if (r.error) {
      console.warn('task_items table error:', r.error.message);
      taskCatalogEditable = false;
      var editBtn = document.getElementById('taskEditToggle');
      if (editBtn) editBtn.style.display = 'none';
      return;
    }
    var rows = r.data || [];
    if (rows.length === 0) {
      taskCatalog = defaultTasksToFlat();
      saveCatalogLocal();
      seedTaskItems();
    } else {
      taskCatalog = rows.map(function(row) {
        return {
          id:          row.id,
          group_name:  row.group_name,
          group_order: row.group_order,
          label:       row.label,
          item_order:  row.item_order,
          deleted:     row.deleted
        };
      });
      saveCatalogLocal();
    }
    renderTasks();
  }).catch(function(err) {
    console.error('Red error task_items:', err);
    taskCatalogEditable = false;
    var editBtn = document.getElementById('taskEditToggle');
    if (editBtn) editBtn.style.display = 'none';
  });

  sb.from('packing_person').select('*').then(function(r) {
    if (r.error) { console.error('packing_person:', r.error); return; }
    (r.data || []).forEach(function(row) {
      if (row.person === '_shared') {
        sharedPack[row.id] = {custom_label: row.custom_label, cat: row.cat, done: row.done, deleted: row.deleted};
        return;
      }
      if (!packPersonState[row.person]) packPersonState[row.person] = {};
      packPersonState[row.person][row.id] = {done: row.done, custom_label: row.custom_label};
    });
    savePackLocal();
    renderPack();
  });

})();
</script>
</body>
</html>
